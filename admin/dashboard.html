    <script>
        (function() {
            'use strict';

            // ==========================================================
            // 1. التكوين – نفس إعدادات الموقع العام
            // ==========================================================
            const CONFIG = {
                owner: 'malegal',
                repo: 'mahmoud-legal',
                branch: 'main',
                articlesPath: 'blog/articles',
                newsPath: 'blog/news'
            };

            // ==========================================================
            // 2. دالة استخراج التاريخ من Front Matter (مطابقة للموقع)
            // ==========================================================
            function extractDateFromFile(content) {
                const yamlMatch = content.match(/---\s*([\s\S]*?)\s*---/);
                if (yamlMatch) {
                    const dateMatch = yamlMatch[1].match(/date:\s*(.*)/i);
                    if (dateMatch) {
                        const dateStr = dateMatch[1].replace(/['"]/g, '').trim();
                        let d = new Date(dateStr);
                        if (!isNaN(d.getTime())) return d.getTime();
                        const parts = dateStr.split(/[-/]/);
                        if (parts.length === 3 && parts[2].length === 4) {
                            d = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                            if (!isNaN(d.getTime())) return d.getTime();
                        }
                        const parsed = Date.parse(dateStr);
                        if (!isNaN(parsed)) return parsed;
                    }
                }
                return 0;
            }

            // ==========================================================
            // 3. دوال جلب البيانات من GitHub
            // ==========================================================
            async function fetchGitHubFiles(path) {
                const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}?ref=${CONFIG.branch}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`فشل جلب ${path} (${res.status})`);
                return await res.json();
            }

            async function loadArticlesFromGitHub() {
                try {
                    const files = await fetchGitHubFiles(CONFIG.articlesPath);
                    const mdFiles = files.filter(f => f.type === 'file' && f.name.endsWith('.md'));
                    const articles = [];
                    for (const file of mdFiles) {
                        const contentRes = await fetch(file.download_url);
                        const content = await contentRes.text();
                        const yamlMatch = content.match(/---\s*([\s\S]*?)\s*---/);
                        let data = {
                            slug: file.name.replace('.md', ''),
                            sha: file.sha,
                            content: content,
                            title: file.name.replace('.md', '').replace(/-/g, ' '),
                            date: '',
                            status: 'published',
                            category: 'general',
                            author: '',
                            seoKeyword: '',
                            tags: [],
                            image: '',
                            description: ''
                        };
                        if (yamlMatch) {
                            const front = yamlMatch[1];
                            const get = (key) => {
                                const m = front.match(new RegExp(key + ':\\s*(.*)', 'i'));
                                return m ? m[1].replace(/['"]/g, '').trim() : '';
                            };
                            data.title = get('title') || data.title;
                            data.date = get('date');
                            data.status = get('status') || 'published';
                            data.category = get('category') || 'general';
                            data.author = get('author') || '';
                            data.seoKeyword = get('seoKeyword') || '';
                            data.tags = get('tags') ? get('tags').split(',').map(t => t.trim()) : [];
                            data.image = get('image') || '';
                            data.description = get('description') || '';
                        }
                        articles.push(data);
                    }
                    return articles;
                } catch (e) {
                    console.error('خطأ في جلب المقالات:', e);
                    return [];
                }
            }

            async function loadNewsFromGitHub() {
                try {
                    const files = await fetchGitHubFiles(CONFIG.newsPath);
                    const mdFiles = files.filter(f => f.type === 'file' && f.name.endsWith('.md'));
                    const news = [];
                    for (const file of mdFiles) {
                        const contentRes = await fetch(file.download_url);
                        const content = await contentRes.text();
                        const yamlMatch = content.match(/---\s*([\s\S]*?)\s*---/);
                        let data = {
                            slug: file.name.replace('.md', ''),
                            sha: file.sha,
                            content: content,
                            title: file.name.replace('.md', '').replace(/-/g, ' '),
                            date: '',
                            status: 'published',
                            category: 'إنجاز قضائي',
                            icon: 'fa-newspaper',
                            tags: [],
                            image: '',
                            description: '',
                            link: ''
                        };
                        if (yamlMatch) {
                            const front = yamlMatch[1];
                            const get = (key) => {
                                const m = front.match(new RegExp(key + ':\\s*(.*)', 'i'));
                                return m ? m[1].replace(/['"]/g, '').trim() : '';
                            };
                            data.title = get('title') || data.title;
                            data.date = get('date');
                            data.status = get('status') || 'published';
                            data.category = get('category') || 'إنجاز قضائي';
                            data.icon = get('icon') || 'fa-newspaper';
                            data.tags = get('tags') ? get('tags').split(',').map(t => t.trim()) : [];
                            data.image = get('image') || '';
                            data.description = get('description') || '';
                            data.link = get('link') || '';
                        }
                        news.push(data);
                    }
                    return news;
                } catch (e) {
                    console.error('خطأ في جلب الأخبار:', e);
                    return [];
                }
            }

            // ==========================================================
            // 4. دالة حفظ التغييرات (ستُرسل إلى الخادم لاحقاً)
            //    هنا سنقوم بتوليد المحتوى الكامل مع Front Matter المعدل
            // ==========================================================
            function generateMarkdown(data, type) {
                const frontMatter = [
                    `title: "${data.title}"`,
                    `date: ${data.date || new Date().toISOString().split('T')[0]}`,
                    `status: ${data.status || 'published'}`,
                    `category: ${data.category || (type === 'article' ? 'general' : 'إنجاز قضائي')}`,
                    `author: ${data.author || 'الأستاذ / محمود عبد الحميد'}`,
                    `seoKeyword: ${data.seoKeyword || ''}`,
                    `tags: ${(data.tags || []).join(', ')}`,
                    `image: ${data.image || ''}`,
                    `description: ${data.description || ''}`
                ];
                if (type === 'news') {
                    frontMatter.push(`icon: ${data.icon || 'fa-newspaper'}`);
                    frontMatter.push(`link: ${data.link || ''}`);
                }
                const front = '---\n' + frontMatter.join('\n') + '\n---\n\n';
                return front + data.content;
            }
