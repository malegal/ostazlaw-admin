<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>تسجيل الدخول – لوحة تحكم المكتبة القانونية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== نفس الهوية البصرية للموقع ===== */
        :root {
            --very-dark-navy: #0B111B;
            --deep-navy: #102A43;
            --warm-off-white: #FAFAF8;
            --pure-white: #FFFFFF;
            --light-gray: #F5F5F5;
            --charcoal: #222222;
            --matte-gold: #B08D57;
            --font-ar: 'Tajawal', sans-serif;
            --font-serif: 'Amiri', serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-ar);
            background: var(--warm-off-white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            direction: rtl;
        }
        .login-container {
            background: var(--pure-white);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.04);
            border: 1px solid rgba(176,141,87,0.08);
            max-width: 400px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .login-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 3px;
            background: var(--matte-gold);
            transition: width 0.6s ease;
        }
        .login-container:hover::after { width: 100%; }
        .login-container h1 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--charcoal);
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .login-container .sub {
            text-align: center;
            color: rgba(34,34,34,0.5);
            font-weight: 300;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }
        .login-container .icon-header {
            text-align: center;
            font-size: 2.5rem;
            color: var(--matte-gold);
            opacity: 0.4;
            margin-bottom: 0.5rem;
        }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: rgba(34,34,34,0.5);
            margin-bottom: 0.2rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: var(--font-ar);
            background: var(--warm-off-white);
            color: var(--charcoal);
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--matte-gold);
            box-shadow: 0 0 0 3px rgba(176,141,87,0.05);
        }
        .btn-gold {
            display: inline-block;
            background: var(--matte-gold);
            color: #000;
            font-weight: 700;
            padding: 14px 36px;
            border-radius: 8px;
            border: none;
            transition: all 0.4s ease;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .btn-gold::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 2px;
            background: var(--matte-gold);
            transition: width 0.6s ease;
        }
        .btn-gold:hover::after { width: 100%; }
        .btn-gold:hover {
            background: #c4a06a;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(176,141,87,0.25);
        }
        .btn-gold:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .error-msg {
            color: #dc2626;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.5rem;
            display: none;
        }
        .error-msg.show { display: block; }
        .footer-text {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(34,34,34,0.3);
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="icon-header"><i class="fas fa-gavel"></i></div>
        <h1>المكتبة القانونية</h1>
        <p class="sub">لوحة تحكم الأستاذ محمود عبد الحميد</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required autofocus />
            </div>
            <button type="submit" class="btn-gold" id="loginBtn">دخول <i class="fas fa-arrow-left" style="margin-right:6px;"></i></button>
            <div class="error-msg" id="errorMsg">كلمة المرور غير صحيحة. حاول مجددًا.</div>
        </form>
        <div class="footer-text">مخصص للإدارة فقط</div>
    </div>
    <script>
        (function() {
            'use strict';
            const form = document.getElementById('loginForm');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            // Rate limiting – 3 محاولات ثم انتظار 30 ثانية
            let attempts = 0;
            let blockedUntil = 0;

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const now = Date.now();
                if (now < blockedUntil) {
                    const remaining = Math.ceil((blockedUntil - now) / 1000);
                    errorMsg.textContent = `تم حظرك مؤقتًا. انتظر ${remaining} ثانية.`;
                    errorMsg.classList.add('show');
                    return;
                }

                const password = passwordInput.value.trim();
                if (!password) return;

                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm" style="margin-left:0.5rem;"></span> جاري التحقق...';

                try {
                    const res = await fetch('/api/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    const data = await res.json();

                    if (data.success) {
                        sessionStorage.setItem('admin_token', data.token);
                        sessionStorage.setItem('admin_expiry', Date.now() + 30 * 60 * 1000);
                        window.location.href = '/admin/dashboard.html';
                    } else {
                        attempts++;
                        if (attempts >= 3) {
                            blockedUntil = Date.now() + 30 * 1000;
                            attempts = 0;
                            errorMsg.textContent = 'تم حظرك مؤقتًا بسبب كثرة المحاولات. انتظر 30 ثانية.';
                        } else {
                            errorMsg.textContent = `كلمة المرور غير صحيحة. تبقى ${3 - attempts} محاولات.`;
                        }
                        errorMsg.classList.add('show');
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                } catch (err) {
                    errorMsg.textContent = 'حدث خطأ في الاتصال. حاول مجددًا.';
                    errorMsg.classList.add('show');
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'دخول <i class="fas fa-arrow-left" style="margin-right:6px;"></i>';
                }
            });
        })();
    </script>
</body>
</html>
